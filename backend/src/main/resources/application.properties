spring.application.name=backend
# spring.profiles.active=dev # Set this via environment variables locally (e.g., in docker-compose)

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vouchervault}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=postmessage

# JWT Configuration
app.jwt.secret=${JWT_SECRET:verysecretkeyMustBeLongEnoughForHS256Algorithm}
app.jwt.expiration-ms=2592000000

# Encryption Master Secret
app.encryption.secret=${SERVER_MASTER_SECRET}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

